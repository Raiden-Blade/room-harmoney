name: Desktop release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows-x64
          - runner: macos-15
            label: macOS-arm64
          - runner: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r packaging/requirements-build.txt

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Frontend install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test self-contained release
        run: python packaging/build_release.py --skip-npm-ci

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: room-harmony-${{ matrix.label }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: room-harmony-*
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G "release/*-unsigned.zip" >/dev/null; then
            echo "Refusing to publish unsigned desktop artifacts as a public GitHub Release."
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
          fi
